<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Alışkanlık Takip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>HabitFlow</h1>
      <p>Günlük Alışkanlıklarını Takip Et</p>
    </header>

    <form id="habit-form">
      <input type="text" id="habit-input" placeholder="Yeni bir alışkanlık gir (örn. Kitap oku)..." required />
      <button type="submit">Ekle</button>
    </form>

    <ul id="habit-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
